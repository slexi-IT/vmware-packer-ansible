---
apiVersion: v1
kind: Namespace
metadata:
  name: ee-build
---
# Builds the EE from the ConfigMap ee-definition (see kustomization.yaml).
#   1. Init container "context": ansible-builder create writes the build context (Containerfile and
#      the files it copies) to the shared emptyDir /context.
#   2. Container "build": BuildKit builds /context with its containerd worker, i.e. through the
#      node's containerd (k0s: socket /run/k0s/containerd.sock), into containerd's namespace
#      k8s.io - the one kubelet uses. AWX's pull policy "never" then finds the image.
# Privileged with the node's containerd socket and directories: effectively root on the node.
# A Job cannot be changed once created: delete it (or wait for ttlSecondsAfterFinished) before
# applying again.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-ee
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: context
          image: docker.io/library/python:3.12-slim
          command: [sh, -ec]
          args:
            - |
              pip install --quiet --root-user-action=ignore ansible-builder==3.1.1
              ansible-builder create -f /ee/execution-environment.yml -c /context --output-filename Containerfile
              ls -la /context
          volumeMounts:
            - {name: ee-definition, mountPath: /ee}
            - {name: context, mountPath: /context}
      containers:
        - name: build
          image: docker.io/moby/buildkit:v0.33.1
          securityContext:
            privileged: true
          envFrom:
            - configMapRef: {name: ee-build-settings}
          env:
            # Use the node's containerd instead of BuildKit's own image store
            - name: BUILDKITD_FLAGS
              value: >-
                --oci-worker=false --containerd-worker=true
                --containerd-worker-addr=/run/k0s/containerd.sock
                --containerd-worker-namespace=k8s.io
          # buildctl-daemonless.sh starts buildkitd for this one build and stops it afterwards
          command: [buildctl-daemonless.sh]
          args:
            - build
            - --progress=plain
            - --frontend=dockerfile.v0
            - --local=context=/context
            - --local=dockerfile=/context
            - --opt=filename=Containerfile
            - --output=type=image,name=$(IMAGE)
          volumeMounts:
            - {name: context, mountPath: /context}
            # containerd's socket and state, and its data directory with the snapshots BuildKit
            # mounts: same paths as on the node, and Bidirectional so mounts BuildKit makes there
            # are visible to containerd
            - {name: k0s-run, mountPath: /run/k0s, mountPropagation: Bidirectional}
            - {name: k0s-containerd, mountPath: /var/lib/k0s/containerd, mountPropagation: Bidirectional}
            - {name: buildkit-state, mountPath: /var/lib/buildkit}
      volumes:
        - name: ee-definition
          configMap: {name: ee-definition}
        - name: context
          emptyDir: {}
        - name: buildkit-state
          emptyDir: {}
        - name: k0s-run
          hostPath: {path: /run/k0s, type: Directory}
        - name: k0s-containerd
          hostPath: {path: /var/lib/k0s/containerd, type: Directory}
