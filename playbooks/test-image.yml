---
# Boot test, for any image (-e image=<image>, -e channel=testing|prod): deploy a VM from the
# image's template that carries the channel tag, wait until VMware Tools report the guest's
# hostname, compare OS name and hostname with image_test in its image.yml, delete the VM.
- name: Boot-test a golden image
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    channel: testing

  vars_files:
    - ../vmware.yml

  environment:
    VMWARE_VALIDATE_CERTS: "{{ (not (vsphere_insecure | bool)) | string | lower }}"

  tasks:
    - name: Load images/<os>/{{ image }}/image.yml
      ansible.builtin.include_tasks: tasks/load_image.yml

    - name: Look up the image's templates
      ansible.builtin.include_tasks: tasks/image_templates.yml

    - name: Pick the template to test
      ansible.builtin.set_fact:
        test_template: "{{ (image_templates | selectattr('channels', 'contains', channel) | first | default({})).name | default('') }}"
        test_name: "imgtest-{{ image }}-{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=6) }}"
        boot_retries: "{{ ((image_test.boot_timeout | default(300)) / 10) | int }}"

    - name: Stop if no template carries the channel tag
      ansible.builtin.assert:
        that: test_template | length > 0
        fail_msg: "No {{ image }} template is tagged '{{ channel }}'"

    - name: Boot test
      block:
        - name: Deploy {{ test_name }} from {{ test_template }}
          vmware.vmware.deploy_folder_template:
            template_name: "{{ test_template }}"
            template_folder: "{{ vsphere_datacenter }}/vm/{{ vsphere_template_folder }}"
            vm_name: "{{ test_name }}"
            vm_folder: "{{ vsphere_datacenter }}/vm/{{ vsphere_work_folder }}"
            datacenter: "{{ vsphere_datacenter }}"
            cluster: "{{ vsphere_cluster }}"
            datastore: "{{ vsphere_datastore }}"
            power_on_after_deploy: true

        # Deployed without guest customization on a network without DHCP, the VM has no address;
        # the test only uses what VMware Tools report through vCenter.
        - name: Wait for VMware Tools to report the guest's hostname
          vmware.vmware.vm_info:
            datacenter: "{{ vsphere_datacenter }}"
            name: "{{ test_name }}"
            schema: vsphere
            properties: [guest.hostName, guest.guestFullName, guest.toolsRunningStatus]
          register: guest
          retries: "{{ boot_retries }}"
          delay: 10
          until: >-
            (guest.vms[0].guest.toolsRunningStatus | default('')) == 'guestToolsRunning'
            and (guest.vms[0].guest.hostName | default('', true)) | length > 0

        - name: Check the results
          ansible.builtin.assert:
            that:
              - image_test.os in (guest.vms[0].guest.guestFullName | default(''))
              - guest.vms[0].guest.hostName is match(image_test.hostname)
            fail_msg: "{{ test_template }} failed its boot test: {{ guest.vms[0].guest | default('no guest info') }}"
            success_msg: >-
              {{ test_template }} booted: {{ guest.vms[0].guest.guestFullName }},
              hostname {{ guest.vms[0].guest.hostName }}

      always:
        - name: Delete {{ test_name }}
          vmware.vmware.vm:
            name: "{{ test_name }}"
            folder: "{{ vsphere_datacenter }}/vm/{{ vsphere_work_folder }}"
            datacenter: "{{ vsphere_datacenter }}"
            state: absent
          failed_when: false

    - name: Publish the result on the AWX job
      ansible.builtin.set_stats:
        data:
          tested_template: "{{ test_template }}"
