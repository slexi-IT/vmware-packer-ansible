---
version: 3

images:
  base_image:
    # awx-ee "latest" of 2026-05-19, pinned by digest: ansible-core 2.18, Python 3.12,
    # ansible-runner 2.4, community.vmware 6.2 and vmware.vmware 2.8 with pyVmomi and the vSphere SDK
    name: quay.io/ansible/awx-ee@sha256:eaab9b09f731e3561ee0d932123a9971c76095555520f71da7ff4f2d433b4c99

dependencies:
  # The base image runs Ansible on Python 3.12, not the system python3 (3.9)
  python_interpreter:
    python_path: /usr/bin/python3.12
  system: bindep.txt
  galaxy: requirements.yml

additional_build_steps:
  append_final:
    # Packer as a single static binary, verified against HashiCorp's published SHA256SUMS.
    # /usr/local/bin is first in PATH, so it wins over cracklib's unrelated /usr/sbin/packer.
    - ARG PACKER_VERSION=1.16.1
    - >-
      RUN set -eux;
      cd /tmp;
      base="https://releases.hashicorp.com/packer/${PACKER_VERSION}";
      zip="packer_${PACKER_VERSION}_linux_amd64.zip";
      curl -fsSLO "${base}/${zip}";
      curl -fsSL "${base}/packer_${PACKER_VERSION}_SHA256SUMS" | grep " ${zip}$" | sha256sum -c -;
      python3 -c "import zipfile; zipfile.ZipFile('${zip}').extract('packer', '/usr/local/bin')";
      chmod 0755 /usr/local/bin/packer;
      rm -f "${zip}";
      packer version
    # Packer plugins live at a fixed path so jobs don't need `packer init` or internet access
    - ENV PACKER_PLUGIN_PATH=/usr/share/packer/plugins CHECKPOINT_DISABLE=1
    - >-
      RUN packer plugins install github.com/hashicorp/vsphere v2.5.0 &&
      packer plugins installed
