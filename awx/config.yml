---
# AWX objects for the vSphere golden image builds (repo slexi-IT/vmware-packer-ansible).
# This file is the source of truth:
# change it here, push, then run the "Apply AWX config" job template (or awx/configure.yml).
# Secrets never live here: credentials are declared without their secret inputs and
# existing secrets are left untouched (see awx/README.md for a fresh AWX).

awx_organization: Default

# The QEMU builds (repo slexi-IT/packer) live in the same AWX: every object made from this file
# starts with this prefix and carries the label "vsphere", so the two never collide
awx_name_prefix: "vsphere/"
awx_extra_labels: [vsphere]

awx_execution_environments:
  - name: AWX EE VMware Packer
    # Built from ee/ (see ee/README.md); in the lab imported into k0s by hand, so never pulled
    image: localhost/awx-ee-vmware-packer:2026.10.02-1
    pull: never
    description: awx-ee (ansible-core 2.18) + Packer 1.16.1 vsphere plugin, vmware.vmware 2.11, community.general 13.4; built from ee/

awx_credentials:
  - name: GitHub deploy key slexi-IT/vmware-packer-ansible
    credential_type: Source Control
    description: Read-only deploy key for this repository
  - name: AWX API (config as code)
    credential_type: Red Hat Ansible Automation Platform
    description: Token the "Apply AWX config" jobs use to talk to this AWX
  - name: vCenter (golden images)
    credential_type: VMware vCenter
    description: >-
      Account for Packer, the vmware.vmware modules and the VMware Tools connection: needs rights
      on the work and template folders, the datastore, tags, and VirtualMachine.GuestOperations.*

awx_instance_groups: []

awx_projects:
  - name: VMware golden images
    description: Golden image builds on vSphere (Rocky Linux, Windows Server), from GitHub slexi-IT/vmware-packer-ansible
    scm_type: git
    scm_url: git@github.com:slexi-IT/vmware-packer-ansible.git
    scm_branch: main
    scm_clean: true
    scm_update_on_launch: true
    scm_update_cache_timeout: 0
    credential: GitHub deploy key slexi-IT/vmware-packer-ansible
    default_environment: AWX EE VMware Packer

# One set of AWX objects per image, generated by configure.yml, so Linux and Windows are kept
# clearly apart: "<image>: build / boot test / promote" job templates with the image fixed,
# "<image>: pipeline" workflow (build -> boot test -> approval -> promote), "<image>: monthly"
# schedule, an OS label and a team that may run and approve only its own images.
awx_images:
  - image: rocky10-base
    os: linux
    team: Linux images
    # Patch Tuesday is the 2nd Tuesday (8th-14th), so the Wednesday after falls on the 9th-15th
    schedule: DTSTART;TZID=Europe/Zurich:20261014T050000 RRULE:FREQ=MONTHLY;INTERVAL=1;BYDAY=WE;BYMONTHDAY=9,10,11,12,13,14,15
    schedule_description: Wednesday after Patch Tuesday, 05:00

  - image: windows2025-std-desktop
    os: windows
    team: Windows images
    # An hour after Rocky: the Windows build with updates takes up to two hours
    schedule: DTSTART;TZID=Europe/Zurich:20261014T060000 RRULE:FREQ=MONTHLY;INTERVAL=1;BYDAY=WE;BYMONTHDAY=9,10,11,12,13,14,15
    schedule_description: Wednesday after Patch Tuesday, 06:00

# Settings shared by every image's job templates
awx_image_job_defaults:
  project: VMware golden images
  inventory: Demo Inventory
  execution_environment: AWX EE VMware Packer
  # vSphere builds talk to vCenter over its API
  credentials: [vCenter (golden images)]

# How long a pipeline's approval waits before the run fails (seconds); 7 days
awx_approval_timeout: 604800

awx_job_templates:
  - name: vsphere/Apply AWX config
    description: Applies awx/config.yml from GitHub slexi-IT/vmware-packer-ansible to this AWX
    project: VMware golden images
    playbook: awx/configure.yml
    inventory: Demo Inventory
    execution_environment: AWX EE VMware Packer
    credentials: [AWX API (config as code)]
