---
# windows2025-std-desktop: Windows Server 2025 Standard (Desktop Experience), evaluation ISO,
# with VMware Tools and all updates; not sysprepped (VMware guest customization does that).
# Read by the playbooks in playbooks/; site settings (datastore, folders, ...) are in vmware.yml.

image_name: windows2025-std-desktop

# Install media on a datastore
image_iso_path: "[{{ vsphere_iso_datastore }}] {{ vsphere_iso_folder }}/Windows-Server-2025-eval-26100.1742-x64-en-us.iso"
# Microsoft publishes no checksum for the evaluation ISO: SHA256 of the download of 2026-10-02
image_iso_checksum: sha256:d0ef4502e350e3c6c53c15b1b3020d38a5ded011bf04998e950720ac8579b23d
# Image inside sources/install.wim: 2 = SERVERSTANDARD (Desktop Experience); 1 Core, 3/4 Datacenter
image_wim_index: 2

image_timezone: W. Europe Standard Time
image_locale: en-US
image_keyboard: "0409:00000409"

# Fixed address of the build VM: the build network has no DHCP. Setup does not need a network;
# the first Ansible step (playbooks/tasks/windows/network.yml) sets this address through VMware
# Tools so Windows Update can run, and sealing removes it again. The template carries no address;
# VMs made from it get theirs from VMware guest customization when they are deployed.
# Placeholders from the documentation range 192.0.2.0/24: replace with the real build network.
image_build_network:
  ip: 192.0.2.11
  prefix: 24
  gateway: 192.0.2.1
  dns: [1.1.1.1]

# What test-image.yml expects from a VM deployed from the template
image_test:
  # VMware Tools' name for the guest OS
  os: Windows Server 2025
  # Not sysprepped: a VM deployed without customization keeps the build's computer name
  hostname: '(?i)^golden-build$'
  # seconds the boot test waits for VMware Tools to report the guest's hostname
  boot_timeout: 600
