---
# Runs in the build VM (vmware_tools connection), last: remove everything that must be unique per
# machine and the build's own access, then power off.
- name: Empty machine-id (first boot generates a new one, so clones never share it)
  ansible.builtin.copy:
    content: ""
    dest: /etc/machine-id
    mode: "0444"

- name: Remove a separate D-Bus machine-id
  ansible.builtin.shell: |
    if [ -e /var/lib/dbus/machine-id ] && [ ! -L /var/lib/dbus/machine-id ]; then rm -f /var/lib/dbus/machine-id; fi
  changed_when: true

- name: Remove SSH host keys (sshd-keygen creates new ones on first boot)
  ansible.builtin.shell: rm -f /etc/ssh/ssh_host_*
  changed_when: true

# The build's fixed address goes; VMs made from the template get theirs from VMware guest
# customization when they are deployed
- name: Remove the build's network profile
  ansible.builtin.shell: rm -f /etc/NetworkManager/system-connections/*.nmconnection
  changed_when: true

# Without a profile NetworkManager would create "Wired connection 1" with DHCP on its own;
# there is no DHCP on these networks
- name: No automatic DHCP profiles
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/90-no-auto-default.conf
    mode: "0644"
    content: |
      # Golden image: no DHCP. Addresses come from VMware guest customization at deploy time.
      [main]
      no-auto-default=*

- name: Remove the random seed, hostname and the build's leftovers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/systemd/random-seed
    - /etc/hostname
    - /root/build-complete
    # Anaconda's copies of the kickstart: original-ks.cfg has the per-build root password in
    # plain text, anaconda-ks.cfg its hash
    - /root/anaconda-ks.cfg
    - /root/original-ks.cfg
    - /root/.bash_history

- name: Clean package caches, temp files and logs
  ansible.builtin.shell: |
    set -e
    dnf clean all
    rm -rf /var/cache/dnf/* /tmp/* /var/tmp/*
    find /var/log -type f -exec truncate -s 0 {} +
  changed_when: true

- name: Check the root password hash from image.yml
  ansible.builtin.assert:
    that: image_root_password_hash is match('^\$6\$[^:\s]+$')
    fail_msg: "image_root_password_hash in image.yml is not a SHA-512 crypt hash ($6$...); create one with: openssl passwd -6"

# Last step, in one command: once root's password is replaced, Ansible's login through VMware
# Tools (with the per-build password) stops working. shutdown -P +1 only schedules the power-off
# one minute ahead, so the command returns before the VM goes down.
- name: Set root's password from image.yml and power off
  ansible.builtin.shell: usermod -p '{{ image_root_password_hash }}' root && shutdown -P +1
  changed_when: true
  no_log: true
