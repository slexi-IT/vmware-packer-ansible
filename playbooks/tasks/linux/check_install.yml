---
# Runs in the build VM (vmware_tools connection). The kickstart's last %post section creates
# /root/build-complete; Anaconda aborts at the first failing section, so the file exists only if
# the whole install succeeded.
- name: Check for /root/build-complete
  ansible.builtin.stat:
    path: /root/build-complete
  register: build_complete

- name: Stop unless the install finished
  ansible.builtin.assert:
    that: build_complete.stat.exists
    fail_msg: "/root/build-complete is missing: the kickstart did not finish (see /root/ks-*.log in the VM)"
