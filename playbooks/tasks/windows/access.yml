---
# Runs in the build VM (vmware_tools connection, PowerShell). Access to VMs made from the image:
# a local administrator with a random password nobody knows, reachable only with the SSH key
# through the built-in OpenSSH server. Vars: image_admin_user, image_admin_ssh_key
- name: Make sure the OpenSSH server is installed (ships with Server 2025)
  ansible.windows.win_shell: |
    if (Get-Service -Name sshd -ErrorAction SilentlyContinue) { 'present' }
    else { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null; 'installed' }
  register: sshd_capability
  changed_when: "'installed' in sshd_capability.stdout"

- name: Start sshd on boot
  ansible.windows.win_service:
    name: sshd
    start_mode: auto
    state: started

- name: Allow SSH through the firewall
  ansible.windows.win_shell: |
    if (Get-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -ErrorAction SilentlyContinue) {
      Enable-NetFirewallRule -Name 'OpenSSH-Server-In-TCP'; 'present'
    } else {
      New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' `
        -Direction Inbound -Protocol TCP -LocalPort 22 -Action Allow | Out-Null; 'created'
    }
  register: ssh_rule
  changed_when: "'created' in ssh_rule.stdout"

- name: Access account with a random password that is thrown away
  ansible.windows.win_user:
    name: "{{ image_admin_user }}"
    fullname: Image access account
    password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits', 'punctuation']) }}"
    update_password: on_create
    password_never_expires: true
    groups: [Administrators]
    groups_action: add
  no_log: true

# Members of Administrators authenticate against this file; sshd ignores it unless only SYSTEM
# and Administrators can access it
- name: Authorise the SSH key for administrators
  ansible.windows.win_copy:
    content: "{{ image_admin_ssh_key }}\n"
    dest: C:\ProgramData\ssh\administrators_authorized_keys

- name: Restrict the key file to SYSTEM and Administrators
  ansible.windows.win_command: icacls.exe C:\ProgramData\ssh\administrators_authorized_keys /inheritance:r /grant Administrators:F /grant SYSTEM:F
  changed_when: true
