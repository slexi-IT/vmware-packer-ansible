---
# Build a golden image on vSphere, for any image in images/<os>/<image>/:
#
#   1. Packer installs from the ISO into the VM build-<image>-<version>; the install powers it off.
#   2. Ansible connects to that VM through VMware Tools (community.vmware.vmware_tools: guest
#      operations via vCenter, no SSH, no WinRM) and runs the image's configure.yml, which ends by
#      shutting the VM down.
#   3. The VM is copied to the template <image>-<version>, deleted, and the template is tagged
#      "testing".
#
# Run with -e image=<image>. Needs AWX's VMware vCenter credential: it sets VMWARE_HOST,
# VMWARE_USER and VMWARE_PASSWORD, which Packer, the vmware.vmware modules and the vmware_tools
# connection read. The vmware_tools connection transfers files directly to the ESXi host running
# the VM, so that host must be reachable on port 443 too.

- name: Install with Packer
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vmware.yml

  environment:
    PACKER_PLUGIN_PATH: /usr/share/packer/plugins
    CHECKPOINT_DISABLE: "1"
    VMWARE_VALIDATE_CERTS: "{{ (not (vsphere_insecure | bool)) | string | lower }}"

  tasks:
    - name: Load images/<os>/{{ image }}/image.yml
      ansible.builtin.include_tasks: tasks/load_image.yml

    - name: Name the build
      ansible.builtin.set_fact:
        # UTC timestamp, so versions sort in build order
        image_version: "{{ now(utc=true).strftime('%Y.%m.%d-%H%M') }}"
        # Password of the account Ansible logs in with through VMware Tools: root (Linux) or
        # Administrator (Windows). It goes into the install answers. Linux keeps it as root's
        # password and the build publishes it as an AWX artifact; Windows replaces it when sealing.
        build_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}Aa1"

    - name: Name the template and the build VM
      ansible.builtin.set_fact:
        template_name: "{{ image_name }}-{{ image_version }}"
        build_vm: "build-{{ image_name }}-{{ image_version }}"

    - name: Create a build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: build-
      register: build_dir

    # Every *.j2 in the image folder is an install answer file (ks.cfg.j2, autounattend.xml.j2);
    # it is rendered into the build directory without the .j2 suffix. 0600: it holds the password.
    - name: Render the install answers
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ build_dir.path }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0600"
      loop: "{{ query('ansible.builtin.fileglob', image_dir ~ '/*.j2') }}"

    - name: Write the Packer variables
      ansible.builtin.copy:
        dest: "{{ build_dir.path }}/build.pkrvars.json"
        mode: "0600"
        content: "{{ packer_vars | to_nice_json }}"
      vars:
        packer_vars: >-
          {{ {'vsphere_insecure': vsphere_insecure | bool,
              'vsphere_datacenter': vsphere_datacenter, 'vsphere_cluster': vsphere_cluster,
              'vsphere_datastore': vsphere_datastore, 'vsphere_network': vsphere_network,
              'vsphere_folder': vsphere_work_folder,
              'iso_path': image_iso_path, 'iso_checksum': image_iso_checksum,
              'vm_name': build_vm, 'build_dir': build_dir.path}
             | combine({'tools_iso_path': vsphere_tools_windows_iso} if image_os == 'windows' else {}) }}

    - name: Run Packer (install; ends with {{ build_vm }} powered off)
      ansible.builtin.command:
        cmd: packer build -color=false -var-file={{ build_dir.path }}/build.pkrvars.json {{ image_name }}.pkr.hcl
        chdir: "{{ image_dir }}"
      register: packer
      changed_when: true
      failed_when: false

    - name: Packer output
      ansible.builtin.debug:
        var: packer.stdout_lines

    - name: Stop if Packer failed
      ansible.builtin.fail:
        msg: "packer build exited with {{ packer.rc }}: {{ packer.stderr | default('', true) | trim }}"
      when: packer.rc != 0

    - name: Power on {{ build_vm }}
      vmware.vmware.vm_powerstate:
        datacenter: "{{ vsphere_datacenter }}"
        name: "{{ build_vm }}"
        folder: "{{ vsphere_datacenter }}/vm/{{ vsphere_work_folder }}"
        state: powered-on

    - name: Wait until VMware Tools in {{ build_vm }} accept guest operations
      vmware.vmware.vm_info:
        datacenter: "{{ vsphere_datacenter }}"
        name: "{{ build_vm }}"
        schema: vsphere
        properties: [guest.guestOperationsReady]
      register: tools
      retries: 60
      delay: 10
      until: tools.vms[0].guest.guestOperationsReady | default(false)

    - name: Add {{ build_vm }} as host build_vm, reached through VMware Tools
      ansible.builtin.add_host:
        name: build_vm
        ansible_connection: community.vmware.vmware_tools
        ansible_vmware_guest_path: "{{ vsphere_datacenter }}/vm/{{ vsphere_work_folder }}/{{ build_vm }}"
        ansible_vmware_validate_certs: "{{ not (vsphere_insecure | bool) }}"
        ansible_vmware_tools_user: "{{ 'Administrator' if image_os == 'windows' else 'root' }}"
        ansible_vmware_tools_password: "{{ build_password }}"
        ansible_shell_type: "{{ 'powershell' if image_os == 'windows' else 'sh' }}"
        ansible_python_interpreter: "{{ omit if image_os == 'windows' else '/usr/bin/python3' }}"
        image_settings_file: "{{ image_settings_file }}"
        image_dir: "{{ image_dir }}"
        tasks_dir: "{{ playbook_dir }}/tasks"
        build_windows_update: "{{ build_windows_update | default(true) }}"

- name: Configure inside the build VM
  hosts: build_vm
  gather_facts: false

  tasks:
    - name: Load the image settings
      ansible.builtin.include_vars:
        file: "{{ image_settings_file }}"

    - name: Run {{ image_dir | basename }}/configure.yml (ends by shutting the VM down)
      ansible.builtin.include_tasks: "{{ image_dir }}/configure.yml"

    - name: Record that configure.yml finished
      ansible.builtin.set_fact:
        configure_done: true

- name: Publish the template
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vmware.yml

  environment:
    VMWARE_VALIDATE_CERTS: "{{ (not (vsphere_insecure | bool)) | string | lower }}"

  tasks:
    # A failed step leaves the VM running; it stays in the work folder for inspection
    - name: Stop if configure.yml did not finish
      ansible.builtin.assert:
        that: hostvars['build_vm'].configure_done | default(false)
        fail_msg: "configure.yml failed in {{ build_vm }} (see above); the VM stays in {{ vsphere_work_folder }}."

    - name: Wait for {{ build_vm }} to power off
      vmware.vmware.vm_info:
        datacenter: "{{ vsphere_datacenter }}"
        name: "{{ build_vm }}"
      register: build_state
      retries: 40
      delay: 15
      until: build_state.vms[0].hw_power_status | default('') == 'poweredOff'

    - name: Copy {{ build_vm }} to the template {{ template_name }}
      vmware.vmware.folder_template_from_vm:
        datacenter: "{{ vsphere_datacenter }}"
        vm_name: "{{ build_vm }}"
        template_name: "{{ template_name }}"
        template_folder: "{{ vsphere_datacenter }}/vm/{{ vsphere_template_folder }}"
        datastore: "{{ vsphere_datastore }}"
        wait_for_template: true

    - name: Delete {{ build_vm }}
      vmware.vmware.vm:
        datacenter: "{{ vsphere_datacenter }}"
        name: "{{ build_vm }}"
        folder: "{{ vsphere_datacenter }}/vm/{{ vsphere_work_folder }}"
        state: absent

    - name: Look up the image's templates
      ansible.builtin.include_tasks: tasks/image_templates.yml

    - name: Tag {{ template_name }} as "testing"
      ansible.builtin.include_tasks: tasks/set_channel.yml
      vars:
        channel: testing
        channel_template: "{{ template_name }}"

    # Shown under Artifacts on the AWX job's details page, to everyone who can see the job.
    # root_password only for Linux: Windows' Administrator password was replaced when sealing.
    - name: Publish the template name (and root's password for Linux) as AWX artifacts
      ansible.builtin.set_stats:
        data: >-
          {{ {'image': image_name, 'template': template_name}
             | combine({'root_password': build_password} if image_os == 'linux' else {}) }}

    - name: Remove the build directory
      ansible.builtin.file:
        path: "{{ build_dir.path }}"
        state: absent
