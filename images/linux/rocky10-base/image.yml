---
# rocky10-base: Rocky Linux 10.2 minimal, installed offline from the ISO, with open-vm-tools.
# Read by the playbooks in playbooks/; site settings (datastore, folders, ...) are in vmware.yml.

image_name: rocky10-base

# Install media on a datastore
image_iso_path: "[{{ vsphere_iso_datastore }}] {{ vsphere_iso_folder }}/Rocky-10.2-x86_64-minimal.iso"
image_iso_checksum: sha256:aac6ac3ce781b91a91ce78463405f66c611a5dca4b3840c79e5e01d97302f6c8
# Volume ID of that ISO (xorriso -indev <iso> -pvd_info); the kickstart mounts it by this label
image_iso_volume_id: Rocky-10-2-x86_64-dvd

image_timezone: Europe/Zurich

# Fixed address of the build VM: the build network has no DHCP. The kickstart configures it
# (install and the installed system); the Ansible phase does not need it, because VMware Tools
# work without a network. Sealing deletes the network profile, so the template carries no address
# and VMs made from it get theirs from VMware guest customization when they are deployed.
# Placeholders from the documentation range 192.0.2.0/24: replace with the real build network.
image_build_network:
  ip: 192.0.2.10
  prefix: 24
  gateway: 192.0.2.1
  dns: [1.1.1.1]

# What test-image.yml expects from a VM deployed from the template
image_test:
  # VMware Tools' name for the guest OS
  os: Rocky Linux
  hostname: '^localhost(\.localdomain)?$'
  # seconds the boot test waits for VMware Tools to report the guest's hostname
  boot_timeout: 300
