---
# Build the EE inside the cluster:  kubectl apply -k ee/
# The image lands directly in the node's containerd (namespace k8s.io), where kubelet finds it -
# no registry, no podman, no k0s ctr import. Works for a single-node cluster: the image exists only
# on the node that ran the Job. Follow the build with:
#   kubectl -n ee-build logs -f job/build-ee --all-containers
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ee-build
resources:
  - build-job.yaml
configMapGenerator:
  # The EE definition, mounted into the Job at /ee
  - name: ee-definition
    files:
      - execution-environment.yml
      - bindep.txt
      - requirements.yml
  # Image name and tag the build produces. Use a new tag for every build, and the same value in
  # awx/config.yml (execution environment "AWX EE VMware Packer").
  - name: ee-build-settings
    literals:
      - IMAGE=localhost/awx-ee-vmware-packer:2026.10.02-1
