---
collections:
  # Templates, tags and VM modules used by playbooks/; newer than the 2.8 in the base image.
  # community.vmware (6.2, from the base image) provides the vmware_tools connection plugin,
  # ansible.windows (3.5, from the base image) the Windows modules run through it.
  - name: vmware.vmware
    version: 2.11.0
  # General-purpose filters and modules (e.g. dict_kv); 13.x needs ansible-core 2.18
  - name: community.general
    version: 13.4.0
